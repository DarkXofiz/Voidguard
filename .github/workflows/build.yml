name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Derle ve test et
        run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: VoidGuard-jar
          path: target/VoidGuard-*.jar

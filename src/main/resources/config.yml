# ===================================================================
#  VoidGuard – yapılandırma
#  Akış: kanıt -> log (yetkiliye) + anında geri alma -> 2. logda vuruşlar 30 sn engellenir ->
#        3. logda oyuncu DONAR, etraf KARARIR, 5 blok YÜKSELİR ve 30 GÜN BAN yer.
#  Yanlış pozitif görürseniz: /vg reset <oyuncu> ve ilgili kontrolün weight/eşiğini düşürün
#  veya checks.<Ad>.enabled: false yapın. Banı tamamen kapatmak için sanctions.ban-enabled: false.
# ===================================================================

general:
  debug: false
  disabled-worlds: []            # kontrollerin kapalı olacağı dünyalar
  bedrock-prefix: "."            # Geyser/Floodgate isim öneki ("" = kapalı)
  bedrock-relaxed: true          # Bedrock oyuncularında Rotation/Aim/AutoClicker/Scaffold-ışın kapalı
  bypass-permission: "voidguard.bypass"

# Lag / bağlantı güvenliği: bu koşullarda KANIT ÜRETİLMEZ.
safety:
  max-ping-ms: 400
  max-ping-ms-air: 1000          # Fly/Step/HighJump (dikey fizik) bu pinge kadar çalışır; TPS düşüşü bunları KAPATMAZ
  min-tps: 18.0
  join-grace-ticks: 100
  teleport-grace-ticks: 30
  respawn-grace-ticks: 60
  flight-toggle-grace-ticks: 80
  gamemode-grace-ticks: 40
  glide-end-grace-ticks: 40
  riptide-grace-ticks: 60
  vehicle-exit-grace-ticks: 20
  ping-jump-ms: 120              # iki saniye arasında ping bu kadar sıçrarsa kısa süre atla
  ping-jump-grace-ticks: 60

# Şüphe puanı: her kanıt (weight x check-weight) puan ekler, zamanla azalır.
suspicion:
  decay-per-second: 0.15
  alert-points-per-check: 4      # bir kontrolün puanı bunu aşınca staff'a bildir
  alert-cooldown-seconds: 3

# Staff / OP bildirimleri
alerts:
  notify-ops: true               # OP olan oyuncular (voidguard.alerts izni olmasa da) uyarı alır
  ops-see-all-evidence: true     # OP'ler puan eşiğine bakılmadan HER kanıtı görür
  notify-when-not-punished: true # ceza eşiği aşıldı ama oyuncu atılmadıysa (ceza kapalı) OP'lere bildir

# ===== Kademeli müdahale =====
# Her kontrol bağımsız puan toplar. Puan "confirm-points" üstüne çıkarsa bir İHLAL sayılır (en fazla dakikada bir,
# kalıcı ve UUID bazlı). Düşük puan = yalnızca kayıt.
#   1. ihlal -> geçici müdahale (örn. 15 sn saldırı/hareket engeli)      (1/3)
#   2. ihlal -> daha uzun kısıtlama                                      (2/3)
#   3. ihlal -> BAN, ama yalnızca: ban-uygun hile + HIGH kanıt + en az N bağımsız hile türü + ban kilidi açık (3/3)
sanctions:
  mitigation-enabled: true       # geçici, kendiliğinden biten müdahaleler
  ban-enabled: true              # 3/3'te süreli ban (kapatmak için false)
  ban-duration-days: 30          # ban süresi (gün). UUID bazlı, sunucu yeniden başlasa da sürer.
  min-distinct-checks-for-ban: 1 # ban için kaç farklı hile türünde ihlal gerekir (1 = tek hile türü yeter)
  save-interval-seconds: 300
  # Log düştüğü ANDA devreye giren kısa engeller (ihlal sayacından bağımsız):
  #   saldırı/blok/konteyner hileleri: işlem iptal edilir | hareket hileleri: geri alma + yerinde dondurma
  instant:
    enabled: true
    min-points: 1                # kontrolün puanı bu değere ulaşınca (ilk kanıt) geri alma devreye girer
    block-seconds: 3             # saldırı / blok koyma / konteyner engeli süresi
    move-freeze-seconds: 2       # hareket dondurma süresi (yerinden oynayamaz, yukarı çıkamaz)
  # ===== LOG SAYACI (en önemli kural) =====
  # Yetkililere giden "gerçek" log = bir kontrolün puanı suspicion.alert-points-per-check eşiğini aştı.
  #   2. gerçek log  -> oyuncunun VURUŞLARI 30 sn engellenir (hile açmayan bunu görmez; gerçek log çıkmaz)
  #   3. log (ban-uygun hile) -> oyuncu birden DONAR, etraf KARARIR, 5 blok YÜKSELİR ve BAN yer
  # Yanlış pozitif koruması: yalnızca ban-eligible kontroller ban sayacına girer, loglar arası en az
  # min-gap-seconds geçmeli, sayaç window-seconds sonra sıfırlanır, lag/muafiyet sırasında kanıt üretilmez.
  log-ban:
    enabled: true
    logs-required: 3
    window-seconds: 180
    min-gap-seconds: 3
    attack-block-at: 2
    attack-block-seconds: 30
  # Ban kararı verilince oyuncu hemen atılmaz: yerinde DONAR (hareket edemez), etrafında kırmızı
  # partikül çemberi döner, yukarı doğru HAVALANIR ve tepede ban ekranıyla atılır. Ban sahne başlamadan
  # kaydedilir; sahne sırasında çıkan oyuncu yine banlıdır. Kapatırsanız oyuncu anında atılır.
  void-sequence:
    enabled: true
    freeze-ticks: 40             # önce yerinde donma + halka (20 tik = 1 sn), sonra yükselme başlar
    rise-ticks: 40               # havalanma süresi
    rise-height: 5.0             # yükselme yüksekliği (blok); üstte engel varsa orada kesilir
    ring-radius: 1.4             # partikül çemberi yarıçapı
    darken: true                 # donduktan sonra etraf kararır (kör efekti + gece; yalnızca istemci tarafı)
    darken-tick: 12              # donmadan kaç tik sonra kararsın
    darken-radius: 20            # bu yarıçaptaki oyuncuların gökyüzü de kararır
  default:
    confirm-points: 6            # ihlal sayılması için kontrol puanı (MEDIUM)
    strong-points: 14            # güçlü kanıt (HIGH) – ban için gerekli
    violations-to-restrict: 2
    violations-to-ban: 3
    expire-hours: 72             # ihlaller bu süre sonunda sayılmaz
    violation-cooldown-seconds: 30
    mitigation-seconds: 15
    restrict-seconds: 30

logging:
  file: true                     # plugins/VoidGuard/logs/vg-YYYY-MM-DD.jsonl
  console: false
  console-min-total: 8
  keep-days: 14
  queue-size: 20000

# Her kontrol: enabled, weight (kanıt başına puan çarpanı) + kontrol özel ayarlar.
checks:
  Reach:
    enabled: true
    weight: 1.0
    tolerance: 0.30              # hedefin ping penceresindeki en yakın konumundan sonra eklenen pay
    buffer: 6
    mob-extra: 0.30
    cancel-margin: 0.50          # bu kadar açık aşımda vuruş anında iptal edilir
    mitigation: ATTACK
    ban-eligible: true
    instant: true
  Aim:                           # bakış ışını hedefi ıskalıyor (rotasyonsuz Aura, HitBox)
    enabled: true
    weight: 1.0
    expand: 0.15
    buffer: 7
    mitigation: ATTACK
    ban-eligible: true
    instant: true
  Aura:                          # çoklu hedef, snap, duvar arkası
    enabled: true
    weight: 1.0
    multi-targets: 3
    multi-ticks: 5
    flick-degrees: 60
    wall-check: true             # HER vuruşta duvar kontrolü; kapalıysa vuruş anında iptal edilir
    angle-cancel-degrees: 70     # bakış hedeften bu kadar saparsa vuruş anında iptal
    mitigation: ATTACK
    ban-eligible: true
    instant: true
  AutoClicker:
    enabled: true
    weight: 1.0
    max-cps: 22
    sustain-seconds: 3
    consistency-samples: 40
    consistency-min-stddev: 0.35
    mitigation: ATTACK
    ban-eligible: false
    instant: false
  Velocity:                      # Anti-Knockback
    enabled: true
    weight: 1.0
    min-ratio: 1.2               # vanilla en kötü durumda ≈4.7 ölçüldü
    buffer: 3
    mitigation: NONE
    ban-eligible: false
    instant: false
  Fly:                           # Fly, Hover, FastFall
    enabled: true
    weight: 1.0
    hover-ticks: 8
    max-rise: 1.32
    mitigation: MOVE
    ban-eligible: true
    instant: true
  Step:
    enabled: true
    weight: 1.0
    mitigation: MOVE
    ban-eligible: true
    instant: true
  HighJump:
    enabled: true
    weight: 1.0
    mitigation: MOVE
    ban-eligible: true
    instant: true
  Speed:
    enabled: true
    weight: 1.0
    margin: 0.10                 # vanilla (sprint+bhop) limitlerinin üstüne tolerans
    ice-multiplier: 2.2
    mitigation: MOVE
    ban-eligible: true
    instant: true
  Timer:                         # Timer / TickShift / paket patlaması
    enabled: true
    weight: 1.0
    max-credit-ms: 800
    tolerance-ms: 100
    mitigation: MOVE
    ban-eligible: true
    instant: false
  NoFall:
    enabled: true
    weight: 1.0
    mitigation: MOVE
    ban-eligible: true
    instant: true
  NoSlow:
    enabled: true
    weight: 1.0
    limit: 0.12
    mitigation: MOVE
    ban-eligible: true
    instant: true
  Scaffold:
    enabled: true
    weight: 1.0
    rate-per-20-ticks: 14
    mitigation: PLACE
    ban-eligible: true
    instant: true
  Criticals:
    enabled: true
    weight: 1.0
    mitigation: ATTACK
    ban-eligible: false
    instant: false
  ChestStealer:
    enabled: true
    weight: 1.0
    min-open-ticks: 3
    samples: 12
    min-stddev: 0.3
    mitigation: CONTAINER
    ban-eligible: false
    instant: false
  GuiMove:
    enabled: true
    weight: 1.0
    mitigation: MOVE
    ban-eligible: false
    instant: false
  Rotation:                      # fare kuantizasyonu (GCD); sinematik kamera/özel istemcilerde yanlış pozitif olabilir
    enabled: true
    weight: 0.4
    window: 40
    min-step: 0.005
    mitigation: NONE
    ban-eligible: false
    instant: false
  Phase:
    enabled: true
    weight: 0.6
    mitigation: MOVE
    ban-eligible: true
    instant: true
  Jesus:                         # sıvı yüzeyinde yürüme
    enabled: true
    weight: 1.0
    ticks: 12
    mitigation: MOVE
    ban-eligible: true
    instant: true
  Spider:                        # duvara tırmanma (Fly sapması duvar yanındaysa)
    enabled: true
    weight: 1.0
    mitigation: MOVE
    ban-eligible: true
    instant: true
  AimAssist:                     # nişan her vuruşta hedef merkezine fazla kilitli
    enabled: true
    weight: 0.7
    samples: 25
    max-mean: 1.2
    max-stddev: 0.7
    mitigation: ATTACK
    ban-eligible: false
    instant: false

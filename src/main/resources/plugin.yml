name: VoidGuard
version: '${project.version}'
main: com.voidguard.anticheat.VoidGuard
api-version: '1.13'
description: Sunucu tarafli, kanita dayali AntiCheat
authors: [VOIDGUARD]
commands:
  voidguard:
    aliases: [vg]
    description: VOIDGUARD yonetim komutu
    usage: /vg help
    permission: voidguard.command
permissions:
  voidguard.command:
    description: /vg komutunu ve yardim ekranini kullanma
    default: op
  voidguard.alerts:
    description: Hile uyarilarini alma ve /vg alerts
    default: op
  voidguard.check:
    description: /vg check
    default: op
  voidguard.info:
    description: /vg info
    default: op
  voidguard.violations:
    description: /vg violations
    default: op
  voidguard.unban:
    description: /vg unban
    default: op
  voidguard.reload:
    description: /vg reload
    default: op
  voidguard.test:
    description: /vg test
    default: op
  voidguard.bypass:
    description: Tum hile kontrollerinden muaf olma
    default: false
  voidguard.admin:
    description: Tum VOIDGUARD yetkileri
    default: op
    children:
      voidguard.command: true
      voidguard.alerts: true
      voidguard.check: true
      voidguard.info: true
      voidguard.violations: true
      voidguard.unban: true
      voidguard.reload: true
      voidguard.test: true

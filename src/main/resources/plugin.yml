name: VoidGuard
version: '${version}'
main: com.voidguard.anticheat.bukkit.VoidGuard
api-version: '1.13'
description: Düşük yanlış-pozitifli, kanıt tabanlı Paper AntiCheat
authors: [VoidGuard]
folia-supported: false
commands:
  vg:
    description: VoidGuard yönetim komutu
    usage: /vg <help|alerts|status|history|exempt|reset|unban|reload>
    aliases: [voidguard]
    permission: voidguard.admin
permissions:
  voidguard.admin:
    description: Yönetim komutları
    default: op
  voidguard.alerts:
    description: Hile uyarılarını görür
    default: op
  voidguard.bypass:
    description: Tüm kontrollerden muaf
    default: false
